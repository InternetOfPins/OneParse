[platformio]

[env]
build_flags = -std=c++17

[env:native]
platform = native
debug_build_flags = -O0 -ggdb3 -g3
lib_extra_dirs = ../../..

[env:nano]
board = nanoatmega328
platform = atmelavr
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
lib_extra_dirs = ../../..
